name: Daily APIx Pipeline (2x/day)

on:
  schedule:
    # 2 AM IST  = 20:30 UTC (previous day)
    # 2 PM IST  = 08:30 UTC (same day)
    - cron: '30 8,20 * * *'
  workflow_dispatch:  # Manual trigger via GitHub UI

jobs:
  pipeline:
    name: Run APIx Daily Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
      issues: write

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        options: >-
          --shm-size=1g

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 || \
          sudo apt-get install -y -qq libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium

      - name: Verify Playwright installation
        run: |
          python - <<'EOF'
          import asyncio
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  await browser.close()

          asyncio.run(main())
          EOF

      - name: Run APIx Daily Pipeline
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FLARESOLVERR_URL: http://flaresolverr:8191
          FLARESOLVERR_REQUIRED: "false"
          LOG_LEVEL: INFO
        run: |
          python main.py

      - name: Upload pipeline summary as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-summary-${{ github.run_id }}
          path: |
            *.json
            *.log
          retention-days: 30

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const title = `[FAILURE] APIx Pipeline - ${new Date().toISOString().split('T')[0]}`;
            const body = `Pipeline failed at ${new Date().toISOString()}\n\nRun: ${runUrl}\n\nCheck logs for details.`;
            await github.rest.issues.create({ owner, repo, title, body, labels: ['pipeline', 'failure'] });